<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Saaf</title>
  <style>
    body { width: 280px; margin: 0; padding: 14px; font: 13px/1.4 system-ui, sans-serif; color: #1a1a1a; background: #fff; }
    h1 { font-size: 15px; margin: 0 0 10px; }
    label { display: block; margin: 6px 0; }
    .stats { margin-top: 12px; border-top: 1px solid #e5e5e5; padding-top: 10px; }
    .muted { color: #666; font-size: 12px; }
    @media (prefers-color-scheme: dark) { body { background: #1e1f22; color: #ececec; } .muted { color: #a0a0a0; } }
  </style>
</head>
<body>
  <h1>Saaf</h1>
  <label><input type="radio" name="mode" value="warn"> Warn before sending</label>
  <label><input type="radio" name="mode" value="auto-mask"> Mask automatically</label>
  <label><input type="radio" name="mode" value="off"> Off</label>
  <div class="stats">
    <div><strong>Caught on this device</strong></div>
    <div id="stats" class="muted">Nothing yet.</div>
  </div>
  <p class="muted">Detection runs locally. Saaf never uploads your messages.</p>
  <script src="popup.js"></script>
</body>
</html>
