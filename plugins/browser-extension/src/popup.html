<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Saaf</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/saaf-32.png" alt="" width="24" height="24">
    <h1>Saaf</h1>
    <span class="ver" id="ver"></span>
  </header>

  <section class="site" id="site">
    <div class="site-row">
      <div>
        <div class="site-name" id="site-name">This page</div>
        <div class="site-state" id="site-state">Checking…</div>
      </div>
      <button type="button" id="site-btn" hidden></button>
    </div>
  </section>

  <section>
    <h2>When a message has personal data</h2>
    <label class="opt"><input type="radio" name="mode" value="warn"> <span><b>Ask me</b> Show what was found, then mask or send.</span></label>
    <label class="opt"><input type="radio" name="mode" value="auto-mask"> <span><b>Mask automatically</b> The AI only ever sees tokens.</span></label>
    <label class="opt"><input type="radio" name="mode" value="off"> <span><b>Off</b> Saaf does nothing.</span></label>
    <label class="opt toggle"><input type="checkbox" id="reveal"> <span><b>Show real values in replies</b> Swaps tokens back on your screen only.</span></label>
  </section>

  <section>
    <h2>Caught on this device</h2>
    <div id="stats" class="muted">Nothing yet.</div>
    <div class="row-btns">
      <button type="button" id="forget" class="link">Forget saved values</button>
      <button type="button" id="reset" class="link">Reset counts</button>
    </div>
  </section>

  <footer>
    Runs on your device. No account, no tracking, no network requests.
    <a href="https://safearly.com/saaf/extension" target="_blank" rel="noopener">How it works</a>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
