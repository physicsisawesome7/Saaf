<svg viewBox="0 0 800 232" role="img" aria-label="Training changes weights through data and many gradient steps. Weight-space programming has a language model read the weights and edit a small number of values directly, with no training loop."><defs><marker id="a-wsp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ig-arrow"/></marker><marker id="av-wsp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ig-arrow v"/></marker></defs><text class="ig-n" x="10" y="18">TRAINING: AN OPTIMIZER CHANGES THE WEIGHTS</text><rect class="ig-box " x="10" y="28" width="160" height="60" rx="12"/><text class="ig-t" x="24" y="54.0">Data</text><text class="ig-s" x="24" y="72.0">examples, rewards</text><path class="ig-line" d="M172,58 L208,58" marker-end="url(#a-wsp)"/><rect class="ig-box " x="210" y="28" width="170" height="60" rx="12"/><text class="ig-t" x="224" y="54.0">Gradient descent</text><text class="ig-s" x="224" y="72.0">many small updates</text><path class="ig-line" d="M382,58 L418,58" marker-end="url(#a-wsp)"/><rect class="ig-box " x="420" y="28" width="170" height="60" rx="12"/><text class="ig-t" x="434" y="54.0">Network weights</text><text class="ig-s" x="434" y="72.0">learned, opaque</text><path class="ig-line dash" d="M505,90 L505,104 L295,104 L295,90" marker-end="url(#a-wsp)"/><text class="ig-s" x="318" y="120">repeat for millions of steps</text><text class="ig-n" x="10" y="150">WEIGHT-SPACE PROGRAMMING: AN LLM EDITS THEM</text><rect class="ig-box k" x="10" y="160" width="160" height="60" rx="12"/><text class="ig-t w" x="24" y="186.0">Plain-language goal</text><text class="ig-s w" x="24" y="204.0">&quot;make it succeed&quot;</text><path class="ig-line v" d="M172,190 L208,190" marker-end="url(#av-wsp)"/><rect class="ig-box v" x="210" y="160" width="170" height="60" rx="12"/><text class="ig-t" x="224" y="186.0">LLM reads weights</text><text class="ig-s" x="224" y="204.0">reasons about them</text><path class="ig-line v" d="M382,190 L418,190" marker-end="url(#av-wsp)"/><rect class="ig-box v" x="420" y="160" width="170" height="60" rx="12"/><text class="ig-t" x="434" y="186.0">Edits a few values</text><text class="ig-s" x="434" y="204.0">e.g. 3.5% of weights</text><path class="ig-line" d="M592,190 L628,190" marker-end="url(#a-wsp)"/><rect class="ig-box ok" x="630" y="160" width="160" height="60" rx="12"/><text class="ig-t" x="644" y="186.0">Changed behaviour</text><text class="ig-s" x="644" y="204.0">no training loop</text></svg>
