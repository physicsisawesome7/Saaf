<svg viewBox="0 0 760 360" role="img" aria-label="The agent security stack: every action an agent requests passes through a policy check, a sandbox, a credential broker and, where needed, human approval before it reaches tools and data."><defs><marker id="a-stack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ig-arrow"/></marker><marker id="av-stack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ig-arrow v"/></marker></defs><rect class="ig-box k" x="120" y="10" width="620" height="46" rx="12"/><text class="ig-t w" x="134" y="29.0">Agent</text><text class="ig-s w" x="134" y="47.0">model + instructions + skills</text><path class="ig-line" d="M430,57 L430,67" marker-end="url(#a-stack)"/><rect class="ig-box v" x="120" y="68" width="620" height="46" rx="12"/><text class="ig-t" x="134" y="87.0">Policy</text><text class="ig-s" x="134" y="105.0">allow / forbid each action, with history (e.g. Cedar-style rules)</text><path class="ig-line" d="M430,115 L430,125" marker-end="url(#a-stack)"/><rect class="ig-box v" x="120" y="126" width="620" height="46" rx="12"/><text class="ig-t" x="134" y="145.0">Sandbox</text><text class="ig-s" x="134" y="163.0">OS-level isolation; all egress through one proxy</text><path class="ig-line" d="M430,173 L430,183" marker-end="url(#a-stack)"/><rect class="ig-box v" x="120" y="184" width="620" height="46" rx="12"/><text class="ig-t" x="134" y="203.0">Credential broker</text><text class="ig-s" x="134" y="221.0">real secret injected outside the agent&#x27;s reach</text><path class="ig-line" d="M430,231 L430,241" marker-end="url(#a-stack)"/><rect class="ig-box w" x="120" y="242" width="620" height="46" rx="12"/><text class="ig-t" x="134" y="261.0">Human approval</text><text class="ig-s" x="134" y="279.0">irreversible or unusual actions</text><path class="ig-line" d="M430,289 L430,299" marker-end="url(#a-stack)"/><rect class="ig-box " x="120" y="300" width="620" height="46" rx="12"/><text class="ig-t" x="134" y="319.0">Tools and data</text><text class="ig-s" x="134" y="337.0">APIs, files, email, payments</text><text class="ig-s" x="10" y="36">request</text><path class="ig-line v" d="M60,44 L60,330" marker-end="url(#av-stack)"/></svg>
