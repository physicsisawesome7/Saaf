<svg viewBox="0 0 790 260" role="img" aria-label="The same question asked by three people gets three different answers: full, masked, or nothing, because each answer is built only from what that person may read."><defs><marker id="a-who" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ig-arrow"/></marker><marker id="av-who" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ig-arrow v"/></marker></defs><rect class="ig-box k" x="10" y="90" width="190" height="70" rx="12"/><text class="ig-t w" x="24" y="121.0">One question</text><text class="ig-s w" x="24" y="139.0">&quot;Who owns plot 17?&quot;</text><path class="ig-line" d="M202,125 C235.0,125 235.0,40 268,40" marker-end="url(#a-who)"/><rect class="ig-box " x="270" y="10" width="200" height="62" rx="12"/><text class="ig-t" x="284" y="37.0">Land officer</text><text class="ig-s" x="284" y="55.0">may read owners</text><path class="ig-line" d="M472,41 L528,41" marker-end="url(#a-who)"/><rect class="ig-box ok" x="530" y="10" width="250" height="62" rx="12"/><text class="ig-t" x="544" y="37.0">Full answer, names shown</text><text class="ig-s" x="544" y="55.0">built only from what they may see</text><path class="ig-line" d="M202,125 C235.0,125 235.0,122 268,122" marker-end="url(#a-who)"/><rect class="ig-box " x="270" y="92" width="200" height="62" rx="12"/><text class="ig-t" x="284" y="119.0">Site engineer</text><text class="ig-s" x="284" y="137.0">may read the plot only</text><path class="ig-line" d="M472,123 L528,123" marker-end="url(#a-who)"/><rect class="ig-box v" x="530" y="92" width="250" height="62" rx="12"/><text class="ig-t" x="544" y="119.0">Answer, owner masked</text><text class="ig-s" x="544" y="137.0">built only from what they may see</text><path class="ig-line" d="M202,125 C235.0,125 235.0,204 268,204" marker-end="url(#a-who)"/><rect class="ig-box " x="270" y="174" width="200" height="62" rx="12"/><text class="ig-t" x="284" y="201.0">Contractor</text><text class="ig-s" x="284" y="219.0">no access to the schedule</text><path class="ig-line" d="M472,205 L528,205" marker-end="url(#a-who)"/><rect class="ig-box w" x="530" y="174" width="250" height="62" rx="12"/><text class="ig-t" x="544" y="201.0">&quot;Nothing I can show you&quot;</text><text class="ig-s" x="544" y="219.0">built only from what they may see</text></svg>
