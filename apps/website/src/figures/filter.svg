<svg viewBox="0 0 600 200" role="img" aria-label="Filtering after the model is too late, because restricted text has already been read. Filtering during search and re-checking before the model means there is nothing to leak."><defs><marker id="a-flt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ig-arrow"/></marker><marker id="av-flt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ig-arrow v"/></marker></defs><text class="ig-n" x="10" y="18">FILTER AFTER THE MODEL: TOO LATE</text><rect class="ig-box " x="10" y="28" width="160" height="58" rx="12"/><text class="ig-t" x="24" y="53.0">All documents</text><text class="ig-s" x="24" y="71.0">searched</text><path class="ig-line" d="M172,57 L208,57" marker-end="url(#a-flt)"/><rect class="ig-box x" x="210" y="28" width="160" height="58" rx="12"/><text class="ig-t" x="224" y="53.0">Model reads</text><text class="ig-s" x="224" y="71.0">restricted text too</text><path class="ig-line" d="M372,57 L408,57" marker-end="url(#a-flt)"/><rect class="ig-box x" x="410" y="28" width="180" height="58" rx="12"/><text class="ig-t" x="424" y="53.0">Filter the answer</text><text class="ig-s" x="424" y="71.0">summary already leaked</text><text class="ig-n" x="10" y="122">FILTER BEFORE: NOTHING TO LEAK</text><rect class="ig-box v" x="10" y="132" width="160" height="58" rx="12"/><text class="ig-t" x="24" y="157.0">Asker&#x27;s documents</text><text class="ig-s" x="24" y="175.0">filter in the search</text><path class="ig-line v" d="M172,161 L208,161" marker-end="url(#av-flt)"/><rect class="ig-box v" x="210" y="132" width="160" height="58" rx="12"/><text class="ig-t" x="224" y="157.0">Re-check</text><text class="ig-s" x="224" y="175.0">against the source</text><path class="ig-line v" d="M372,161 L408,161" marker-end="url(#av-flt)"/><rect class="ig-box ok" x="410" y="132" width="180" height="58" rx="12"/><text class="ig-t" x="424" y="157.0">Model reads</text><text class="ig-s" x="424" y="175.0">only allowed passages</text></svg>
