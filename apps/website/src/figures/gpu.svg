<svg viewBox="0 0 920 132" role="img" aria-label="Illustration: many questions are answered by verified quotes, code or the cache, so only the remaining share needs the model and the GPU."><defs><marker id="a-gpu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ig-arrow"/></marker><marker id="av-gpu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ig-arrow v"/></marker></defs><rect class="ig-box ok" x="10" y="30" width="399.0" height="70" rx="12"/><text class="ig-t" x="24" y="61.0">Lookups and table maths</text><text class="ig-s" x="24" y="79.0">verified quote or code, no model</text><rect class="ig-box v" x="415.0" y="30" width="174.0" height="70" rx="12"/><text class="ig-t" x="429.0" y="61.0">Repeat questions</text><text class="ig-s" x="429.0" y="79.0">guarded cache</text><rect class="ig-box k" x="595.0" y="30" width="309.0" height="70" rx="12"/><text class="ig-t w" x="609.0" y="61.0">Needs the model</text><text class="ig-s w" x="609.0" y="79.0">short, compressed, prefix-cached prompt</text><text class="ig-s" x="10" y="20">Illustrative share of questions on a typical day</text><text class="ig-s" x="10" y="122">Only the last group costs GPU time, so one card goes further.</text></svg>
