<svg viewBox="0 0 1030 112" role="img" aria-label="A safe path for an agent skill: publish, review before installing, grant only what it declares, run it sandboxed with checks on every call, require approval for irreversible actions, and record every decision."><defs><marker id="a-skill" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ig-arrow"/></marker><marker id="av-skill" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ig-arrow v"/></marker></defs><rect class="ig-box k" x="10" y="20" width="150" height="80" rx="12"/><text class="ig-n" x="24" y="40">01</text><text class="ig-t w" x="24" y="62.0">Publish</text><text class="ig-s w" x="24" y="80.0">instructions,</text><text class="ig-s w" x="24" y="95.0">scripts, tools</text><path class="ig-line" d="M162,60 L178,60" marker-end="url(#a-skill)"/><rect class="ig-box " x="180" y="20" width="150" height="80" rx="12"/><text class="ig-n" x="194" y="40">02</text><text class="ig-t" x="194" y="62.0">Review</text><text class="ig-s" x="194" y="80.0">read what it can do</text><text class="ig-s" x="194" y="95.0">before installing</text><path class="ig-line" d="M332,60 L348,60" marker-end="url(#a-skill)"/><rect class="ig-box v" x="350" y="20" width="150" height="80" rx="12"/><text class="ig-n" x="364" y="40">03</text><text class="ig-t" x="364" y="62.0">Grant</text><text class="ig-s" x="364" y="80.0">only declared tools,</text><text class="ig-s" x="364" y="95.0">data and hosts</text><path class="ig-line" d="M502,60 L518,60" marker-end="url(#a-skill)"/><rect class="ig-box v" x="520" y="20" width="150" height="80" rx="12"/><text class="ig-n" x="534" y="40">04</text><text class="ig-t" x="534" y="62.0">Run</text><text class="ig-s" x="534" y="80.0">sandboxed, checked</text><text class="ig-s" x="534" y="95.0">at every call</text><path class="ig-line" d="M672,60 L688,60" marker-end="url(#a-skill)"/><rect class="ig-box w" x="690" y="20" width="150" height="80" rx="12"/><text class="ig-n" x="704" y="40">05</text><text class="ig-t" x="704" y="62.0">Approve</text><text class="ig-s" x="704" y="80.0">a person confirms</text><text class="ig-s" x="704" y="95.0">irreversible acts</text><path class="ig-line" d="M842,60 L858,60" marker-end="url(#a-skill)"/><rect class="ig-box ok" x="860" y="20" width="150" height="80" rx="12"/><text class="ig-n" x="874" y="40">06</text><text class="ig-t" x="874" y="62.0">Record</text><text class="ig-s" x="874" y="80.0">a log of every</text><text class="ig-s" x="874" y="95.0">decision</text></svg>
