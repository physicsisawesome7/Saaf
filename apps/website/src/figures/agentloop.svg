<svg viewBox="0 0 980 236" role="img" aria-label="The agent loop: plan, call a tool, read the result as a numbered passage, repeat until it can answer, then verify. Tool calls that change data wait for the asker&#x27;s approval."><defs><marker id="a-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ig-arrow"/></marker><marker id="av-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ig-arrow v"/></marker></defs><rect class="ig-box k" x="10" y="70" width="150" height="64" rx="12"/><text class="ig-t w" x="24" y="98.0">Question</text><text class="ig-s w" x="24" y="116.0">as the asker</text><path class="ig-line" d="M162,102 L208,102" marker-end="url(#a-loop)"/><rect class="ig-box " x="210" y="70" width="150" height="64" rx="12"/><text class="ig-t" x="224" y="98.0">Plan</text><text class="ig-s" x="224" y="116.0">pick the next tool</text><path class="ig-line" d="M362,102 L408,102" marker-end="url(#a-loop)"/><rect class="ig-box v" x="410" y="70" width="160" height="64" rx="12"/><text class="ig-t" x="424" y="98.0">Call a tool</text><text class="ig-s" x="424" y="116.0">search · API · code</text><path class="ig-line" d="M572,102 L618,102" marker-end="url(#a-loop)"/><rect class="ig-box " x="620" y="70" width="150" height="64" rx="12"/><text class="ig-t" x="634" y="98.0">Read result</text><text class="ig-s" x="634" y="116.0">numbered passage</text><path class="ig-line dash" d="M695,68 C695,20 285,20 285,68" marker-end="url(#a-loop)"/><text class="ig-s" x="400" y="26">repeat until it can answer (step limit)</text><path class="ig-line" d="M772,102 L818,102" marker-end="url(#a-loop)"/><rect class="ig-box ok" x="820" y="70" width="150" height="64" rx="12"/><text class="ig-t" x="834" y="98.0">Verified answer</text><text class="ig-s" x="834" y="116.0">cites the passages</text><path class="ig-line v" d="M490,136 L490,170" marker-end="url(#av-loop)"/><rect class="ig-box w" x="380" y="172" width="220" height="56" rx="12"/><text class="ig-t" x="394" y="196.0">Changes data?</text><text class="ig-s" x="394" y="214.0">wait for the asker&#x27;s approval</text></svg>
