# Hooks other repositories can use:
#   - repo: https://github.com/safearly/saaf
#     rev: core-v0.1.0
#     hooks: [{ id: saaf-scan }]
- id: saaf-scan
  name: saaf scan (Indian PII)
  description: Fail the commit if Aadhaar, PAN, GSTIN, UPI or other Indian PII is found.
  entry: saaf scan --fail-on-findings
  language: python
  additional_dependencies: ["saaf"]
  types: [text]
  exclude: \.(lock|svg)$
