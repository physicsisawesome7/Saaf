name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  lint:
    name: Lint, types, spec drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: uv sync --all-packages
      - name: Actions pinned to commit SHAs
        run: python scripts/pin_actions.py --check
      - name: Spec copies in sync
        run: uv run python scripts/sync_spec.py --check
      - name: Spec matches JSON schema
        run: uvx check-jsonschema --schemafile spec/schema/entities.schema.json spec/entities.json
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: No compliance claims
        run: git ls-files '*.md' '*.html' '*.js' '*.ts' '*.py' | xargs uv run python scripts/check_wording.py
      - run: npm ci
      - run: npm run typecheck

  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --all-packages
      - name: saaf-core (with coverage gate)
        working-directory: packages/saaf-core
        run: uv run pytest --cov=saaf --cov-report=xml --cov-fail-under=85
      - name: saaf-gateway
        working-directory: packages/saaf-gateway
        run: uv run pytest
      - name: plugins
        shell: bash
        run: |
          (cd plugins/litellm && uv run pytest)
          (cd plugins/open-webui && uv run --with pydantic pytest tests)
          (cd plugins/langchain && uv run pytest)
          (cd plugins/mcp-server && uv run pytest)
          (cd plugins/claude-code-hook && uv run pytest test_saaf_hook.py)
      - name: bench
        working-directory: bench
        run: uv run pytest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          name: coverage
          path: packages/saaf-core/coverage.xml

  js:
    name: TypeScript / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Build + tests (incl. shared conformance vectors)
        run: npm run build && npm test
      - name: Website and extension bundles build
        run: node apps/website/build.mjs && node plugins/browser-extension/build.mjs

  bench-gate:
    name: Benchmark regression gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync --all-packages
      - name: Run IndicPII-Bench on corpus v0
        working-directory: bench
        run: uv run python -m indicpii_bench run --corpus corpus/v0/docs.jsonl --systems saaf,regex-baseline --out-dir /tmp/bench
      - name: Compare with committed results
        run: uv run python scripts/bench_gate.py bench/results/results.json /tmp/bench/results.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-results
          path: /tmp/bench

  docker:
    name: Gateway image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/saaf-gateway/Dockerfile
          push: false
          tags: saaf-gateway:ci
