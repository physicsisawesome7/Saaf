name: Release

# Tag formats: core-v0.2.0, js-v0.2.0, gateway-v0.2.0, litellm-v0.2.0,
# langchain-v0.2.0, mcp-v0.2.0. Before the first public release, pin every
# action below to a full commit SHA (Dependabot keeps the pins current).

on:
  push:
    tags: ["core-v*", "js-v*", "gateway-v*", "litellm-v*", "langchain-v*", "mcp-v*"]

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.p.outputs.kind }}
      package: ${{ steps.p.outputs.package }}
      path: ${{ steps.p.outputs.path }}
      version: ${{ steps.p.outputs.version }}
    steps:
      - id: p
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          prefix="${tag%%-v*}"; version="${tag#*-v}"
          case "$prefix" in
            core)      echo "kind=python" >> $GITHUB_OUTPUT; echo "package=saaf"       >> $GITHUB_OUTPUT; echo "path=packages/saaf-core"    >> $GITHUB_OUTPUT ;;
            gateway)   echo "kind=python" >> $GITHUB_OUTPUT; echo "package=saaf-gateway"   >> $GITHUB_OUTPUT; echo "path=packages/saaf-gateway" >> $GITHUB_OUTPUT ;;
            litellm)   echo "kind=python" >> $GITHUB_OUTPUT; echo "package=saaf-litellm"   >> $GITHUB_OUTPUT; echo "path=plugins/litellm"       >> $GITHUB_OUTPUT ;;
            langchain) echo "kind=python" >> $GITHUB_OUTPUT; echo "package=saaf-langchain" >> $GITHUB_OUTPUT; echo "path=plugins/langchain"     >> $GITHUB_OUTPUT ;;
            mcp)       echo "kind=python" >> $GITHUB_OUTPUT; echo "package=saaf-mcp"       >> $GITHUB_OUTPUT; echo "path=plugins/mcp-server"    >> $GITHUB_OUTPUT ;;
            js)        echo "kind=npm"    >> $GITHUB_OUTPUT; echo "package=@safearly/saaf" >> $GITHUB_OUTPUT; echo "path=packages/saaf-js"      >> $GITHUB_OUTPUT ;;
            *) echo "unknown tag prefix $prefix"; exit 1 ;;
          esac
          echo "version=$version" >> $GITHUB_OUTPUT

  python:
    needs: plan
    if: needs.plan.outputs.kind == 'python'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write      # GitHub release
      id-token: write      # PyPI Trusted Publishing + attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
      - name: Check version matches tag
        run: |
          uv sync --all-packages
          v=$(uv run python -c "import importlib.metadata as m; print(m.version('${{ needs.plan.outputs.package }}'))")
          test "$v" = "${{ needs.plan.outputs.version }}" || { echo "version $v != tag"; exit 1; }
      - name: Test
        working-directory: ${{ needs.plan.outputs.path }}
        run: uv run pytest
      - name: Build
        run: |
          cp LICENSE NOTICE ${{ needs.plan.outputs.path }}/ 2>/dev/null || true
          uv build --package ${{ needs.plan.outputs.package }} --out-dir dist
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ${{ needs.plan.outputs.path }}
          format: cyclonedx-json
          output-file: dist/sbom.cdx.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.whl
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          attestations: true
          packages-dir: dist
          skip-existing: false
        env:
          SKIP_SBOM: "1"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true

  npm:
    needs: plan
    if: needs.plan.outputs.kind == 'npm'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write      # npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build && npm test
      - name: Check version matches tag
        run: test "$(node -p "require('./packages/saaf-js/package.json').version")" = "${{ needs.plan.outputs.version }}"
      - run: cp LICENSE packages/saaf-js/ && npm publish --workspace packages/saaf-js --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true

  image:
    needs: [plan, python]
    if: needs.plan.outputs.package == 'saaf-gateway'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write      # keyless cosign
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/saaf-gateway/Dockerfile
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/saaf-gateway:${{ needs.plan.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/saaf-gateway:latest
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/saaf-gateway@${{ steps.build.outputs.digest }}
