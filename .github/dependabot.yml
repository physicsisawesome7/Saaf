version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    groups:
      python-dev: { dependency-type: development }

  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }

  - package-ecosystem: docker
    directory: /packages/saaf-gateway
    schedule: { interval: weekly }
