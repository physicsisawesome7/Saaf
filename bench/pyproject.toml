[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "indicpii-bench"
dynamic = ["version"]
description = "IndicPII-Bench: open benchmark for Indian PII detection, hard-negative false positives and restore round-trip."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["saaf"]

[project.optional-dependencies]
presidio = ["presidio-analyzer>=2.2.364"]

[project.scripts]
indicpii-bench = "indicpii_bench.__main__:main"

[tool.hatch.version]
path = "indicpii_bench/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["indicpii_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../packages/saaf-core/src"]
