[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "saaf-gateway"
dynamic = ["version"]
description = "OpenAI- and Anthropic-compatible proxy that masks Indian PII before it reaches the model and restores it in (streamed) responses."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Saaf contributors" }]
dependencies = [
  "saaf[crypto]",
  "fastapi>=0.142.4",
  "httpx>=0.27",
  "uvicorn[standard]>=0.29",
]

[project.scripts]
saaf-gateway = "saaf_gateway.__main__:main"

[tool.hatch.version]
path = "src/saaf_gateway/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/saaf_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../saaf-core/src"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
