[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "smriti"
dynamic = ["version"]
description = "Smriti by Safearly: self-hostable, permission-aware institutional memory with cited, version-aware answers on open-weight models."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Safearly" }]
dependencies = [
  "saaf",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "pydantic>=2.6",
  "pyyaml>=6",
  "sqlalchemy>=2.0",
  "numpy>=1.26",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "pypdf>=4",
  "python-docx>=1.1",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
tables = ["duckdb>=1.0"]
qdrant = ["qdrant-client>=1.9"]
postgres = ["psycopg[binary]>=3.1"]
s3 = ["boto3>=1.34"]
mcp = ["mcp>=1.2"]
browser = ["playwright>=1.44"]
all = ["smriti[tables,qdrant,postgres,s3,mcp]"]

[project.scripts]
smriti = "smriti.cli:main"

[tool.hatch.version]
path = "src/smriti/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/smriti"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../saaf-core/src"]
addopts = "-ra --strict-markers"
