<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smriti by Safearly</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='11' y='7' width='18' height='7' rx='3.5' fill='%236D28D9'/%3E%3Crect x='3' y='18' width='18' height='7' rx='3.5' fill='%230A0A0A'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><rect x="11" y="7" width="18" height="7" rx="3.5" fill="var(--violet)"/><rect x="3" y="18" width="18" height="7" rx="3.5" fill="var(--ink)"/></svg>
      <div><div class="wordmark">smriti</div><div class="by">by safearly</div></div>
    </div>
    <nav id="nav">
      <a data-view="ask" class="active"><span class="ic">◎</span>Ask</a>
      <a data-view="library"><span class="ic">▤</span>Library</a>
      <a data-view="watch"><span class="ic">◉</span>Watch<span class="badge" id="alertCount"></span></a>
      <a data-view="skills"><span class="ic">✓</span>Skills</a>
      <a data-view="memory"><span class="ic">✎</span>Memory</a>
      <a data-view="govern"><span class="ic">⛨</span>Govern</a>
    </nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <main>
    <header class="top">
      <div class="tenant" id="tenantName">…</div>
      <div class="who">
        <label for="userSel" class="eyebrow">Viewing as</label>
        <select id="userSel"></select>
        <div class="chips" id="userChips"></div>
      </div>
    </header>
    <section id="view"></section>
  </main>
</div>
<div id="drawer" class="drawer" hidden><div class="drawer-body" id="drawerBody"></div></div>
<div id="toast" class="toast" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
